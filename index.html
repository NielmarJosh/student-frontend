<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eef2f1;
      --surface: #ffffff;
      --ink: #14232b;
      --muted: #566a72;
      --line: #cdd8d6;
      --teal: #0f6b6b;
      --teal-dark: #0a4f4f;
      --error: #a3191f;
      --display: 'Bricolage Grotesque', 'Segoe UI', Arial, sans-serif;
      --body: 'Public Sans', 'Segoe UI', Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      font-size: 1rem;
      line-height: 1.5;
    }

    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 72px; }

    h1 {
      font-family: var(--display);
      font-size: clamp(2.25rem, 7vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }

    .lede { margin: 0 0 32px; color: var(--muted); max-width: 52ch; }

    h2 { font-family: var(--display); font-size: 1.25rem; margin: 0 0 16px; }

    form {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 40px;
    }

    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }

    input {
      width: 100%;
      font: inherit;
      color: inherit;
      padding: 10px 12px;
      margin-bottom: 18px;
      border: 1px solid #9fb0ad;
      border-radius: 6px;
      background: #fff;
    }

    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 2px;
    }

    .hint { display: block; font-weight: 400; color: var(--muted); }

    button {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      padding: 11px 20px;
      background: var(--teal);
      color: #fff;
    }
    button:hover { background: var(--teal-dark); }
    button:disabled { opacity: 0.6; cursor: progress; }

    .status { margin: 14px 0 0; min-height: 1.5em; font-size: 0.95rem; }
    .status.error { color: var(--error); }
    .status.ok { color: var(--teal-dark); }

    .log-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 8px;
    }
    .log-head h2 { margin: 0; }
    .count { color: var(--muted); font-size: 0.9rem; }

    .link-btn {
      background: none;
      color: var(--teal-dark);
      padding: 4px 0;
      text-decoration: underline;
      font-weight: 500;
    }
    .link-btn:hover { background: none; color: var(--ink); }

    .row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 4px 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .when { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
    .name { font-weight: 600; overflow-wrap: anywhere; }
    .note { color: var(--ink); overflow-wrap: anywhere; }

    .empty { padding: 24px 0; color: var(--muted); }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
      form { padding: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Lab Attendance</h1>
    <p class="lede">Sign in for your lab session. Every entry is saved to the database and appears in the log below.</p>

    <form id="dataForm">
      <label for="title">Student name</label>
      <input type="text" id="title" maxlength="100" autocomplete="name" required>

      <label for="content">Lab session <span class="hint">For example: Chemistry Lab, Section B</span></label>
      <input type="text" id="content" maxlength="1000" required>

      <button type="submit" id="submitBtn">Sign in</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <section aria-labelledby="logTitle">
      <div class="log-head">
        <h2 id="logTitle">Attendance log</h2>
        <span class="count" id="count"></span>
        <button type="button" class="link-btn" id="refreshBtn">Refresh</button>
      </div>
      <div id="recordsContainer"><p class="empty">Loading records…</p></div>
    </section>
  </main>

  <script>
    // Your Vercel API (must end in /api)
    const VERCEL_API_URL = 'https://student-api-backend-wine.vercel.app/api';

    const form = document.getElementById('dataForm');
    const statusEl = document.getElementById('status');
    const container = document.getElementById('recordsContainer');
    const countEl = document.getElementById('count');
    const submitBtn = document.getElementById('submitBtn');

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function formatTime(value) {
      const d = new Date(value);
      if (isNaN(d)) return '';
      return d.toLocaleString([], {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    function showMessage(text) {
      container.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = text;
      container.appendChild(p);
    }

    async function loadRecords() {
      try {
        const response = await fetch(VERCEL_API_URL);
        if (!response.ok) throw new Error('Server returned ' + response.status);
        const records = await response.json();

        countEl.textContent = records.length === 1 ? '1 entry' : records.length + ' entries';

        if (records.length === 0) {
          showMessage('No entries yet. Sign in above to add the first one.');
          return;
        }

        container.innerHTML = '';
        records.forEach(record => {
          const row = document.createElement('div');
          row.className = 'row';

          const when = document.createElement('div');
          when.className = 'when';
          when.textContent = formatTime(record.createdAt);

          const body = document.createElement('div');

          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = record.title;

          const note = document.createElement('div');
          note.className = 'note';
          note.textContent = record.content;

          body.append(name, note);
          row.append(when, body);
          container.appendChild(row);
        });
      } catch (error) {
        console.error(error);
        countEl.textContent = '';
        showMessage('Could not load the log. Check your connection, then select Refresh.');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();

      setStatus('', '');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';

      try {
        const response = await fetch(VERCEL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || 'Server returned ' + response.status);
        }
        form.reset();
        setStatus('Signed in. Your entry is saved.', 'ok');
        await loadRecords();
      } catch (error) {
        console.error(error);
        setStatus('Could not save your entry. ' + error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', loadRecords);

    loadRecords();
  </script>
</body>
</html>
